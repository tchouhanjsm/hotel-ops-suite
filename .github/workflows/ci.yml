name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hotel_ops
          POSTGRES_USER: hotel_admin
          POSTGRES_PASSWORD: hotel_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hotel_admin -d hotel_ops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest pytest-cov ruff mypy
          pip install sqlalchemy psycopg[binary] alembic pydantic-settings httpx

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://hotel_admin:hotel_dev_password@localhost:5432/hotel_ops
        run: pytest

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Mypy
        working-directory: backend
        run: mypy app

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
